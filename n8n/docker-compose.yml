services:
  n8n:
    image: n8nio/n8n:latest
    restart: always
    ports:
      - "5678:5678"
    environment:
      # Mantener la misma clave de encriptación
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-your-secret-key}
      
      # Configuración básica
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=${N8N_PORT:-5678}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${N8N_PROTOCOL:-http}://${N8N_HOST:-localhost}:${N8N_PORT:-5678}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Lima}
      - TZ=${TZ:-America/Lima}
      
      # Base de datos PostgreSQL (migrado de SQLite)
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${PGDATABASE:-marketai_seo}
      - DB_POSTGRESDB_USER=${PGUSER:-marketai_user}
      - DB_POSTGRESDB_PASSWORD=${PGPASSWORD:-marketai_secure_password}
      
      # Mejoras de rendimiento
      - N8N_METRICS=true
      - N8N_HIRING_BANNER_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=true
      
      # Configuración de ejecución
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=true
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      
      # OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}

      # WordPress
      - WORDPRESS_MEDIA_ENDPOINT=${WP_BASE_URL}/wp-json/wp/v2/media
      - WP_BASE_URL=${WP_BASE_URL}
      - WP_APP_USER=${WP_APP_USER}
      - WP_APP_PASSWORD=${WP_APP_PASSWORD}
    volumes:
      - ./storage:/home/node/.n8n
      - ./workflows:/home/node/.n8n/workflows
    networks:
      - n8n-network
    depends_on:
      - postgres

      

  postgres:
    image: postgres:latest
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=marketai_seo
      - POSTGRES_USER=marketai_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-marketai_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - n8n-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketai_user -d marketai_seo"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    networks:
      - n8n-network
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local

networks:
  n8n-network:
    driver: bridge